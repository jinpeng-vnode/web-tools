<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简易白板</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --fg: #1c1915;
      --muted: #5c564c;
      --card: #fffdf8;
      --line: #d9d2c5;
      --accent: #1f4d3a;
      --board: #ffffff;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161411;
        --fg: #f3eee4;
        --muted: #b4ab9c;
        --card: #211d18;
        --line: #3a342c;
        --accent: #8fbfa6;
        --board: #faf8f5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    a { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
    h1 { font-size: 1.6rem; font-weight: 650; margin: 12px 0 4px; }
    .lead { color: var(--muted); margin: 0 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .tool-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
    }
    .tool-group legend, .tool-group .group-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-right: 4px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      min-width: 40px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--fg);
      font: inherit;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    label.field-label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    input[type="color"] {
      width: 44px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      cursor: pointer;
      background: var(--card);
    }
    input[type="range"] { width: 120px; accent-color: var(--accent); }
    .board-wrap {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      touch-action: none;
      background: var(--board);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
    }
    canvas.eraser { cursor: cell; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="../index.html">← 返回工具首页</a>
      <h1>简易白板</h1>
      <p class="lead">离线静态画板：画笔、橡皮、撤销与导出 PNG。非 Excalidraw 官方组件，可在本地直接使用。</p>
    </header>

    <div class="card">
      <div class="toolbar" role="toolbar" aria-label="画板工具">
        <fieldset class="tool-group" style="border:none;margin:0;padding:6px 10px">
          <span class="group-label" id="mode-label">工具</span>
          <button type="button" class="btn" id="tool-pen" aria-pressed="true" aria-labelledby="mode-label" title="画笔 (P)">画笔</button>
          <button type="button" class="btn" id="tool-eraser" aria-pressed="false" title="橡皮 (E)">橡皮</button>
        </fieldset>

        <div class="tool-group">
          <label class="field-label" for="stroke-color">颜色</label>
          <input type="color" id="stroke-color" value="#1c1915" aria-label="画笔颜色" />
        </div>

        <div class="tool-group">
          <label class="field-label" for="stroke-width">线宽 <span id="width-display">4</span>px</label>
          <input type="range" id="stroke-width" min="1" max="48" value="4" aria-valuemin="1" aria-valuemax="48" aria-valuenow="4" />
        </div>

        <button type="button" class="btn" id="btn-undo" disabled title="撤销 (Ctrl+Z)">撤销</button>
        <button type="button" class="btn" id="btn-clear" title="清空画布">清空</button>
        <button type="button" class="btn btn-primary" id="btn-download" title="下载 PNG">下载 PNG</button>
      </div>

      <div class="board-wrap">
        <canvas id="board" width="1024" height="640" aria-label="画板区域，可使用鼠标或触摸绘制"></canvas>
      </div>
      <p class="hint">快捷键：P 画笔，E 橡皮，Ctrl+Z 撤销。支持鼠标与触摸屏。</p>
    </div>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var colorEl = document.getElementById('stroke-color');
      var widthEl = document.getElementById('stroke-width');
      var widthDisplay = document.getElementById('width-display');
      var penBtn = document.getElementById('tool-pen');
      var eraserBtn = document.getElementById('tool-eraser');
      var undoBtn = document.getElementById('btn-undo');
      var clearBtn = document.getElementById('btn-clear');
      var downloadBtn = document.getElementById('btn-download');

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var logicalW = 1024;
      var logicalH = 640;

      canvas.width = Math.round(logicalW * dpr);
      canvas.height = Math.round(logicalH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      function layoutCanvas() {
        var wrap = canvas.parentElement;
        var cssW = wrap.clientWidth;
        canvas.style.width = cssW + 'px';
        canvas.style.height = Math.round(cssW * logicalH / logicalW) + 'px';
      }

      var strokes = [];
      var undoStack = [];
      var current = null;
      var mode = 'pen';
      var drawing = false;

      function setMode(m) {
        mode = m;
        penBtn.setAttribute('aria-pressed', m === 'pen' ? 'true' : 'false');
        eraserBtn.setAttribute('aria-pressed', m === 'eraser' ? 'true' : 'false');
        canvas.classList.toggle('eraser', m === 'eraser');
      }

      function pushUndo() {
        undoStack.push(JSON.stringify(strokes));
        if (undoStack.length > 50) undoStack.shift();
        undoBtn.disabled = undoStack.length === 0;
      }

      function redraw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, logicalW, logicalH);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, logicalW, logicalH);
        strokes.forEach(drawStroke);
        if (current) drawStroke(current);
      }

      function drawStroke(s) {
        if (!s.points || s.points.length < 1) return;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = s.width;
        if (s.tool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = s.color;
        }
        ctx.beginPath();
        ctx.moveTo(s.points[0].x, s.points[0].y);
        for (var i = 1; i < s.points.length; i++) {
          ctx.lineTo(s.points[i].x, s.points[i].y);
        }
        if (s.points.length === 1) {
          ctx.lineTo(s.points[0].x + 0.01, s.points[0].y + 0.01);
        }
        ctx.stroke();
        ctx.restore();
      }

      function pointerPos(e) {
        var rect = canvas.getBoundingClientRect();
        var x = (e.clientX - rect.left) * (logicalW / rect.width);
        var y = (e.clientY - rect.top) * (logicalH / rect.height);
        return { x: x, y: y };
      }

      function startStroke(e) {
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        drawing = true;
        var p = pointerPos(e);
        current = {
          tool: mode,
          color: colorEl.value,
          width: Number(widthEl.value),
          points: [p]
        };
      }

      function moveStroke(e) {
        if (!drawing || !current) return;
        e.preventDefault();
        current.points.push(pointerPos(e));
        redraw();
      }

      function endStroke(e) {
        if (!drawing) return;
        e.preventDefault();
        drawing = false;
        if (current && current.points.length) {
          pushUndo();
          strokes.push(current);
          current = null;
          redraw();
        }
      }

      canvas.addEventListener('pointerdown', startStroke);
      canvas.addEventListener('pointermove', moveStroke);
      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointerleave', endStroke);
      canvas.addEventListener('pointercancel', endStroke);

      penBtn.addEventListener('click', function () { setMode('pen'); });
      eraserBtn.addEventListener('click', function () { setMode('eraser'); });

      widthEl.addEventListener('input', function () {
        widthDisplay.textContent = widthEl.value;
        widthEl.setAttribute('aria-valuenow', widthEl.value);
      });

      undoBtn.addEventListener('click', function () {
        if (!undoStack.length) return;
        var snap = undoStack.pop();
        strokes = JSON.parse(snap);
        undoBtn.disabled = undoStack.length === 0;
        redraw();
      });

      clearBtn.addEventListener('click', function () {
        if (!strokes.length && !current) return;
        if (!window.confirm('确定清空整张画板？')) return;
        pushUndo();
        strokes = [];
        current = null;
        redraw();
      });

      downloadBtn.addEventListener('click', function () {
        var off = document.createElement('canvas');
        off.width = canvas.width;
        off.height = canvas.height;
        var octx = off.getContext('2d');
        octx.fillStyle = '#ffffff';
        octx.fillRect(0, 0, off.width, off.height);
        octx.drawImage(canvas, 0, 0);
        off.toBlob(function (blob) {
          if (!blob) return;
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'whiteboard-' + Date.now() + '.png';
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        }, 'image/png');
      });

      document.addEventListener('keydown', function (e) {
        if (e.target.matches('input')) return;
        if (e.key === 'p' || e.key === 'P') setMode('pen');
        if (e.key === 'e' || e.key === 'E') setMode('eraser');
        if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) {
          e.preventDefault();
          undoBtn.click();
        }
      });

      window.addEventListener('resize', layoutCanvas);
      layoutCanvas();
      redraw();
    })();
  </script>
</body>
</html>
